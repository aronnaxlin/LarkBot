models:
  primary:
    apiBaseUrl: "https://api.openai.com/v1"
    apiKey: ""
    model: "gpt-5.4"
    apiFormat: "responses" # openai-chat | responses | anthropic-messages
    timeoutSec: 120 # complete non-streaming request timeout
    maxImagesAllowed: 100
    # Extra provider-native request fields are shallow-merged at the wire boundary.
    # extraBody:
    #   reasoning:
    #     effort: "high"
    #     summary: "auto"

  probe:
    apiBaseUrl: "https://api.anthropic.com/v1"
    apiKey: ""
    model: "claude-haiku-4-5"
    apiFormat: "anthropic-messages"
    timeoutSec: 60
    maxImagesAllowed: 10

# Chat platform for this process: "telegram" (default) or "feishu".
# platform: "feishu"

# Feishu/Lark (platform: feishu). Required in Feishu mode. Like the Telegram
# token and model API keys above, the secret lives in this git-ignored file.
# Feishu chats should set `sendTypingAction: false` (no typing API) and must not
# enable `tools.banSpammer`. See docs/feishu-implementation.md.
# feishu:
#   appId: "cli_xxxxxxxxxxxxxxxx"
#   appSecret: ""
#   domain: "feishu"   # "feishu" (default) | "lark" | https:// base URL

# Trusted maintainers: canonical platform user ids — Feishu open_ids (`ou_...`)
# or Telegram user ids as strings. This is trusted deployment configuration and
# the ONLY source of maintainer status; claims in chat never establish it.
# Their messages render with `maintainer="true"`; no permission currently
# depends on the list. Replace the placeholder with your own id.
# maintainers:
#   - "ou_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Required only when platform is "telegram".
telegram:
  botToken: ""
  apiId: 0
  apiHash: ""
  userbotEnabled: false
  # botDataDir: "data/tdlib-bot"
  # userbotDataDir: "data/tdlib-userbot"

database:
  path: "./data/cahciua.db"

# Modular plugins (docs/plugins.md).
# Plugins are mounted under plugins/ and declared statically.
# Secret credentials live in this git-ignored file.
plugins:
  server:
    host: "0.0.0.0"
    port: 8787
  tavern:
    enabled: false
    secret: ""            # shared HMAC secret agreed with the dealer; kept out of git
    model: "probe"        # model used for game decisions
    decisionTimeoutMs: 10000
    tableName: "LuckyBot" # table name shown at the dealer

# Person memory (docs/memory-design.md): Markdown cards per member under
# <memoryDir>/<chatId>/. Must sit under the writable data volume; enable it per
# chat with chats.<id>.memory below.
memoryDir: "./data/memory"

runtime:
  # Where the Bash tool executes. These defaults run shell commands in the bot
  # process itself and read/write files on its filesystem — no isolation — so
  # enable `tools.bash` only when you accept that (see the Security section in
  # AGENTS.md).
  shell: ["/bin/bash", "-c"]
  writeFile: ["/bin/bash", "-c", "/usr/bin/cat > \"$0\""]
  readFile: ["/usr/bin/cat"]
  # Docker deployment (docs/deploy.md): run all three inside the sandbox
  # container instead, so the Bash tool, download_file and read_image paths are
  # confined to /home/sandbox/work and never touch /app. Uncomment together.
  # The wrapper is installed in the bot image from deploy/sandbox-exec and
  # talks to the sandbox over SSH (host/port/key overridable via env).
  # shell: ["/usr/local/bin/sandbox-exec", "shell"]
  # writeFile: ["/usr/local/bin/sandbox-exec", "write"]
  # readFile: ["/usr/local/bin/sandbox-exec", "read"]
  writeFileSizeLimit: 20971520
  readFileSizeLimit: 20971520

backgroundTasks:
  outputDir: "./data/task-outputs"
  retentionCount: 20

# Every key other than "default" is a resident chat ID. Per-chat objects are
# deep-merged over default. Telegram archives unconfigured chats without projection;
# Feishu ignores unconfigured groups and private chats entirely.
chats:
  default:
    primary:
      model: "primary"
      turnBudget:
        maxToolRounds: 2
        maxToolCalls: 4
        maxParticipationCalls: 3 # combined sends/reactions; end_turn is exempt
        deadlineMs: 15000 # from primary start, probe excluded; does not abort an in-flight tool
        minModelCallMs: 2000 # must be less than deadlineMs
        wrapUpReserveMs: 6000 # below this much time left, the next step only answers (0 = off)
      # Replay provider reasoning only for this many newest turn responses, plus
      # the current interrupted tool chain (Anthropic requires its thinking
      # blocks). Older reasoning is dropped from the request, not from storage.
      reasoningReplayTurns: 3
    probe:
      # Probe is mandatory. Omit model to reuse the primary endpoint.
      model: "probe"
      # Probe HTTP bound, independent of the primary deadline; the model's
      # timeoutSec applies if lower. Timeouts/5xx/network errors are retried.
      timeoutMs: 15000
      # Estimated-token cap for the probe's recent slice. The slice holds the
      # chat since the bot last acted (its latest own message or primary
      # turn); a no_action probe does not advance that boundary. It grows
      # from half this cap to the cap, then the window start jumps forward,
      # so the request prefix stays cache-stable between jumps.
      contextEstTokens: 20000
      # The compaction summary is always included and does not count against
      # contextEstTokens. It is capped separately and truncated from the end
      # (deep history) rather than dropped.
      summaryMaxEstTokens: 20000
    systemFiles:
      # Copy prompts/IDENTITY.example.md to prompts/IDENTITY.md and edit it.
      # IDENTITY.md is deployment-local and gitignored; see prompts/.gitignore.
      - "prompts/IDENTITY.md"
      - "prompts/style-enforcements.md"
    sendTypingAction: true
    blockedUserIds: []

    debounce:
      initialDelayMs: 1000
      typingExtendMs: 5000
      maxDelayMs: 30000

    compaction:
      maxContextEstTokens: 200000
      workingWindowEstTokens: 8000
      # Optional dedicated summarization endpoint. A ~200K-token compaction
      # took about 2 minutes live, so give its model entry timeoutSec >= 300
      # (the primary model's own timeoutSec is separate).
      # model: "primary"

    # Per-person long-term memory (docs/memory-design.md). A background
    # consolidator writes evidence-backed cards from the chat archive and the
    # latest speakers' cards are injected into the late-binding prompt. Off by
    # default; start in shadow mode (enabled: true, inject: false) and inspect
    # the cards before injecting them.
    memory:
      enabled: false
      inject: true # false = write cards, inject nothing (shadow mode)
      # Omit to reuse compaction.model, then the primary endpoint.
      # model: "primary"
      triggerMessages: 40 # human messages since the cursor (>= 5)
      maxWindowMessages: 200 # cap one consolidation batch and the first window
      cardMaxChars: 1200 # per person card
      selfMaxChars: 1000 # SELF.md
      hearsayMaxEntries: 3 # third-party "群里的说法：" entries per card
      hearsayMaxChars: 500
      injectionMaxChars: 4000 # all person cards in one prompt
      selfInjectionChars: 800 # SELF.md in one prompt
      lookbackMessages: 30 # recent chat scanned for whose cards to inject
      recentSpeakers: 4 # cards injected at most
      doNotReadd: 20 # recent forgotten facts fed back to the writer

    imageToText:
      enabled: false
      model: "primary"
      maxConcurrency: 3

    animationToText:
      enabled: false
      model: "primary"
      maxFrames: 5
      maxConcurrency: 3

    customEmojiToText:
      enabled: false
      model: "primary"
      maxFrames: 5
      maxConcurrency: 3

    # How talkative the bot is in this chat (AGENTS.md "Participation And Turn
    # Budget"). style: quiet | normal | lively. brakeMessages10m is the soft
    # self-volume brake. cooldownSec / maxPerHour (0 = off) are hard limits on
    # speaking up unprompted; @-mentions, quote-replies and name-calls are
    # still answered.
    participation:
      style: "normal"
      brakeMessages10m: 10
      cooldownSec: 0
      maxPerHour: 0
      # Bot-to-bot rounds a human-requested exchange may run.
      botRounds: 2
      # requested: answer another bot only when a human asks; open: engage on its own.
      botInteraction: "requested"
    plugins:
      tavern:
        enabled: false
    tools:
      # Enable per chat only; moderation policy belongs in that chat's systemFiles.
      banSpammer: false
      bash:
        # Whether the Bash tool is offered to this chat. It is only isolated
        # when runtime.shell/readFile/writeFile point at the sandbox container
        # (docs/deploy.md); with the defaults in this file it runs with the
        # bot's own filesystem access, so keep it off against real group input.
        # enabled: false
        # Shell tools (`bash`, `kill_task`, `read_task_output`) are exposed only
        # when a trusted maintainer spoke since the bot's last action.
        requireMaintainer: true
        # A maintainer message older than this many seconds no longer opens the
        # gate (bounds the window after silent turns and no_action probes).
        maintainerWindowSec: 600
        backgroundThresholdSec: 10
      web:
        providers:
          tavily: { apiKey: "" }
          microsoftGrounding: { apiKey: "" }
          jina: { apiKey: "" }
          exa: { apiKey: "" }
        # search: "tavily" # tavily | microsoft-grounding | jina | exa
        # fetch: "jina"

  # Replace with a Telegram chat ID (or a Feishu `oc_...` group chat ID) to
  # enable residency and Driver processing.
  "-1000000000000": {}
  # To enable moderation for a specific group:
  # "-1001234567890":
  #   tools: { banSpammer: true }
  #   systemFiles:
  #     - "prompts/IDENTITY.md"
  #     - "prompts/group-moderation.md"
